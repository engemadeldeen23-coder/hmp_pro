name: hmp_pro
description: HMP PRO - Industrial Light Weight Deflectometer
publish_to: 'none'
version: 3.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_blue_plus: ^1.35.5
  fl_chart: ^0.68.0
  csv: ^5.1.1
  permission_handler: ^11.3.1
  intl: ^0.19.0
  geolocator: ^12.0.0
  shared_preferences: ^2.3.2
  share_plus: ^10.0.2
  path_provider: ^2.1.4
  flutter_tts: ^4.0.2
  http: ^1.2.2
  battery_plus: ^6.0.1
  pdf: ^3.11.1
  printing: ^5.13.1
  image_picker: ^1.1.2

 
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.13.1
  flutter_native_splash: ^2.4.0

# App Icon configuration
flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/logo.png"
  adaptive_icon_background: "#0A0E1A"
  adaptive_icon_foreground: "assets/icon/logo.png"

# Splash screen configuration
flutter_native_splash:
  color: "#0A0E1A"
  image: assets/icon/logo.png
  android: true
  ios: false
  android_12:
    image: assets/icon/logo.png
    color: "#0A0E1A"
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true